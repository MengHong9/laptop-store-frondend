server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 3m;   # laptop photo uploads (the API allows 2 MB); nginx's default is only 1 MB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API: same origin as the site, so the browser needs no CORS.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: any other URL (/orders, /admin/users ...) must serve index.html, otherwise a page refresh is a 404.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri /index.html;
    }
}
